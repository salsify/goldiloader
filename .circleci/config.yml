version: 2.1
jobs:
  lint:
    docker:
      - image: ruby:3.2.10
    environment:
      BUNDLE_GEMFILE: gemfiles/rails_7.2.gemfile
    working_directory: ~/goldiloader
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-gems-ruby-3.2.10-{{ checksum "goldiloader.gemspec" }}-{{ checksum "gemfiles/rails_7.2.gemfile" }}
            - v1-gems-ruby-3.2.10-
      - run:
          name: Install Gems
          command: |
            bundle config set path 'vendor/bundle'
            if ! bundle check; then
              bundle install --jobs=4 --retry=3
              bundle clean
            fi
      - save_cache:
          key: v1-gems-ruby-3.2.10-{{ checksum "goldiloader.gemspec" }}-{{ checksum "gemfiles/rails_7.2.gemfile" }}
          paths:
            - "vendor/bundle"
            - "gemfiles/vendor/bundle"
      - run:
          name: Run Rubocop
          command: bundle exec rubocop
  test:
    parameters:
      gemfile:
        type: string
      ruby_version:
        type: string
    docker:
      - image: ruby:<< parameters.ruby_version >>
    environment:
      CIRCLE_TEST_REPORTS: "test-results"
      BUNDLE_GEMFILE: << parameters.gemfile >>
    working_directory: ~/goldiloader
    steps:
      - checkout
      - unless:
          condition:
            equal: ["gemfiles/rails_edge.gemfile", << parameters.gemfile >>]
          steps:
            - restore_cache:
                keys:
                  - v1-gems-ruby-<< parameters.ruby_version >>-{{ checksum "goldiloader.gemspec" }}-{{ checksum "<< parameters.gemfile >>" }}
                  - v1-gems-ruby-<< parameters.ruby_version >>-
      - run:
          name: Install Gems
          command: |
            bundle config set path 'vendor/bundle'
            if ! bundle check; then
              bundle install --jobs=4 --retry=3
              bundle clean
            fi
      - unless:
          condition:
            equal: [ "gemfiles/rails_edge.gemfile", << parameters.gemfile >> ]
          steps:
            - save_cache:
                key: v1-gems-ruby-<< parameters.ruby_version >>-{{ checksum "goldiloader.gemspec" }}-{{ checksum "<< parameters.gemfile >>" }}
                paths:
                  - "vendor/bundle"
                  - "gemfiles/vendor/bundle"
      - run:
          name: Run Tests
          command: |
            bundle exec rspec --format RspecJunitFormatter --out $CIRCLE_TEST_REPORTS/rspec/junit.xml --format progress spec
      - store_test_results:
          path: "test-results"
workflows:
  build:
    jobs:
      - lint
      - test:
          matrix:
            parameters:
              gemfile:
                - gemfiles/rails_7.2.gemfile
                - gemfiles/rails_8.0.gemfile
                - gemfiles/rails_8.1.gemfile
                - gemfiles/rails_edge.gemfile
              ruby_version:
                - 3.2.10
                - 3.3.10
                - 3.4.9
                - 4.0.2
            exclude:
              - gemfile: gemfiles/rails_edge.gemfile
                ruby_version: 3.2.10
  weekly_rails_edge:
    triggers:
      - schedule:
          cron: 0 0 * * 0
          filters:
            branches:
              only:
                - master
    jobs:
      - test:
          matrix:
            parameters:
              gemfile:
                - gemfiles/rails_edge.gemfile
              ruby_version:
                - 4.0.2
